name: SBH roundtrip one-shot

on:
  push:
    branches:
      - agent/sbh-level-runtime-roundtrip

permissions:
  contents: write

jobs:
  fix-clippy-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sbh-level-runtime-roundtrip
          fetch-depth: 0

      - name: Keep serializer test-only until editor consumes it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("examples/smart_boy_hero/world/level_spec.rs")
          text = path.read_text()
          old = "    pub(super) fn to_json(&self) -> Result<String, String> {"
          new = "    #[cfg(test)]\n    pub(super) fn to_json(&self) -> Result<String, String> {"
          if text.count(old) != 1:
              raise SystemExit(f"expected one to_json method, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt

      - name: Commit Clippy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/smart_boy_hero/world/level_spec.rs
          git commit -m "Keep SBH level serializer test-only for now"
          git push origin HEAD:agent/sbh-level-runtime-roundtrip
