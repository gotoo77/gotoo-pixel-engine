name: Apply text glyph fix

on:
  push:
    branches:
      - "probe/text-glyph-conformance-final"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: "probe/text-glyph-conformance-final"

      - name: Apply patch
        run: python3 scripts/apply_text_glyph_fix.py

      - name: Format and validate
        run: |
          cargo fmt --all
          python3 scripts/dev.py check

      - name: Commit validated fix
        run: |
          rm scripts/apply_text_glyph_fix.py
          rm .github/workflows/apply-text-glyph-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(text): cover printable ASCII in built-in fonts"
          git push origin HEAD:probe/text-glyph-conformance-final
