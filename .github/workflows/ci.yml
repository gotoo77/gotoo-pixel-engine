name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Validate native targets
        run: python3 scripts/dev.py check --print-lock-base64

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache wasm-bindgen CLI
        id: cache-wasm-bindgen-cli
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.127

      - name: Install wasm-bindgen CLI
        if: steps.cache-wasm-bindgen-cli.outputs.cache-hit != 'true'
        run: cargo +1.97.1 install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Validate Web targets
        run: python3 scripts/dev.py check-web

      - name: Validate Web packaging
        run: python3 scripts/dev.py build-web
