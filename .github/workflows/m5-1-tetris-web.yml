name: Temporary Tetris web migration

on:
  push:
    branches:
      - m5.1-tetris-web
    paths:
      - .github/scripts/m5_1_tetris_web.py
      - .github/scripts/m5_1_tetris_web_fix.py
      - .github/workflows/m5-1-tetris-web.yml

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: m5.1-tetris-web

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Apply Tetris web migration
        run: |
          python .github/scripts/m5_1_tetris_web.py
          python .github/scripts/m5_1_tetris_web_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check Tetris WASM build
        run: cargo build --target wasm32-unknown-unknown --example tetris_web

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml examples/tetris/game.rs examples/tetris_web.rs scripts/build-web.sh web/tetris.html
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "webify Tetris with VirtualPad"
          git push origin HEAD:m5.1-tetris-web
