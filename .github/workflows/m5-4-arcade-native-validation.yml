name: Temporary shared Arcade validation

on:
  push:
    branches:
      - m5.4-arcade-launcher

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: m5.4-arcade-launcher

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --all -- --check

      - name: Whitespace check
        run: git diff --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build native Arcade
        run: cargo build --example arcade

      - name: Build web Arcade
        run: cargo build --target wasm32-unknown-unknown --example arcade_web
