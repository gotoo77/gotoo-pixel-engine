name: Temporary browser gamepad validation

on:
  push:
    branches:
      - m5.5-web-gamepad

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: m5.5-web-gamepad

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Wire browser gamepad backend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gamepad = Path("src/gamepad.rs")
          text = gamepad.read_text()
          old = '''#[cfg(target_arch = "wasm32")]
          #[derive(Default)]
          pub(crate) struct GamepadInputBackend;

          #[cfg(target_arch = "wasm32")]
          impl GamepadInputBackend {
              pub(crate) fn poll<F>(&mut self, _input: &mut Input, _profile_for: F)
              where
                  F: FnMut(GamepadId) -> Option<GamepadProfile>,
              {
              }
          }
          '''
          new = '''#[cfg(target_arch = "wasm32")]
          mod browser;
          #[cfg(target_arch = "wasm32")]
          pub(crate) use browser::GamepadInputBackend;
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit("WASM gamepad no-op block not found")
              gamepad.write_text(text.replace(old, new, 1))

          cargo = Path("Cargo.toml")
          text = cargo.read_text()
          old_features = '"Storage", "Window"]'
          new_features = '"Storage", "Window", "Gamepad", "GamepadButton", "GamepadMappingType", "Navigator"]'
          if new_features not in text:
              if old_features not in text:
                  raise SystemExit("web-sys feature list tail not found")
              cargo.write_text(text.replace(old_features, new_features, 1))

          arcade = Path("examples/arcade/game.rs")
          text = arcade.read_text()
          old_enum = "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ArcadeInteractionMode"
          new_enum = "#[derive(Debug, Clone, Copy, PartialEq, Eq)]\n#[allow(dead_code)]\npub enum ArcadeInteractionMode"
          if new_enum not in text:
              if old_enum not in text:
                  raise SystemExit("ArcadeInteractionMode declaration not found")
              arcade.write_text(text.replace(old_enum, new_enum, 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Whitespace check
        run: git diff --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Native clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Arcade WASM
        run: cargo build --target wasm32-unknown-unknown --example arcade_web

      - name: Commit validated browser backend
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src/gamepad.rs src/gamepad/browser.rs examples/arcade/game.rs
          git commit -m "add browser standard gamepad backend"
          git push origin HEAD:m5.5-web-gamepad
