name: Temporary Snake VirtualPad migration

on:
  push:
    branches:
      - m5.0-virtual-pad

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[snake-migrated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: m5.0-virtual-pad

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup component add rustfmt clippy

      - name: Migrate Snake touch input
        run: |
          python .github/scripts/migrate_snake_virtual_pad.py
          python .github/scripts/post_virtual_pad_migration_fixes.py

      - name: Format
        run: cargo fmt --all

      - name: Check tests
        run: cargo test --all-targets

      - name: Check clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/snake/game.rs examples/breakout.rs examples/pong.rs
          git commit -m "migrate Snake touch controls to VirtualPad [snake-migrated]"
          git push origin HEAD:m5.0-virtual-pad
