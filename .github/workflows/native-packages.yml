name: Native game packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - infra/native-packaging
    tags:
      - "void-canticle-v*"

permissions:
  contents: read

jobs:
  package:
    name: Package Void Canticle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: void-canticle-linux-x86_64
            archive: dist/native/void-canticle-linux-x86_64.tar.gz
          - os: windows-latest
            target: windows-x86_64
            artifact: void-canticle-windows-x86_64
            archive: dist/native/void-canticle-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust 1.97.1
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build native package
        run: python scripts/dev.py package-native void-canticle

      - name: Inspect Linux runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd target/release/examples/void_canticle | tee dist/native/void-canticle-linux-x86_64.ldd.txt
          if grep -q "not found" dist/native/void-canticle-linux-x86_64.ldd.txt; then
            echo "Unresolved Linux runtime dependency"
            exit 1
          fi

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  smoke:
    name: Smoke extracted package (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact: void-canticle-linux-x86_64
            archive: void-canticle-linux-x86_64.tar.gz
          - os: windows-latest
            target: windows-x86_64
            artifact: void-canticle-windows-x86_64
            archive: void-canticle-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download packaged archive
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: package

      - name: Extract and launch Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir extracted
          tar -xzf "package/${{ matrix.archive }}" -C extracted
          test -x extracted/void_canticle
          test -f extracted/assets/void_canticle/ui/choice/manifest.json
          ldd extracted/void_canticle | tee linux-runtime-deps.txt
          if grep -q "not found" linux-runtime-deps.txt; then
            echo "Unresolved Linux runtime dependency after extraction"
            exit 1
          fi
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          pushd extracted >/dev/null
          set +e
          timeout 8s xvfb-run -a ./void_canticle > ../launch.log 2>&1
          status=$?
          set -e
          popd >/dev/null
          cat launch.log
          if [ "$status" -eq 124 ]; then
            echo "Package remained alive for the smoke window"
            exit 0
          fi
          exit "$status"

      - name: Extract and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path "package/${{ matrix.archive }}" -DestinationPath extracted
          if (-not (Test-Path "$PWD/extracted/assets/void_canticle/ui/choice/manifest.json")) {
            throw "Void Canticle runtime assets are missing from the package"
          }
          $process = Start-Process -FilePath "$PWD/extracted/VoidCanticle.exe" `
            -WorkingDirectory "$PWD/extracted" `
            -RedirectStandardOutput "$PWD/launch.out" `
            -RedirectStandardError "$PWD/launch.err" `
            -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            Get-Content "$PWD/launch.out" -ErrorAction SilentlyContinue
            Get-Content "$PWD/launch.err" -ErrorAction SilentlyContinue
            throw "VoidCanticle.exe exited during the smoke window with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Get-Content "$PWD/launch.out" -ErrorAction SilentlyContinue
          Get-Content "$PWD/launch.err" -ErrorAction SilentlyContinue
          Write-Host "Package remained alive for the smoke window"

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          pattern: void-canticle-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi