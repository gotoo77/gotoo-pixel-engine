name: Deploy GPE games to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Important: if a Pages build has already uploaded a `github-pages` artifact,
# start a fresh workflow run instead of re-running that build job. Re-running
# the build in the same run creates duplicate artifacts and deploy-pages will
# reject the run because it cannot choose between them.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GPE
        uses: actions/checkout@v7

      - name: Checkout Arcade standalone
        uses: actions/checkout@v7
        with:
          repository: gotoo77/gpe_arcade
          ref: main
          token: ${{ secrets.GPE_STANDALONE_REPOS_TOKEN }}
          path: _standalone/gpe_arcade

      - name: Checkout Smart Boy Hero standalone
        uses: actions/checkout@v7
        with:
          repository: gotoo77/gpe_smartboyhero
          ref: main
          token: ${{ secrets.GPE_STANDALONE_REPOS_TOKEN }}
          path: _standalone/gpe_smartboyhero

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Prepare GPE Pages shell
        run: python3 scripts/dev.py build-web --pages

      - name: Configure Cargo access to private standalone dependencies
        env:
          STANDALONE_TOKEN: ${{ secrets.GPE_STANDALONE_REPOS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${STANDALONE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Build Arcade from standalone repository
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo build \
            --manifest-path _standalone/gpe_arcade/Cargo.toml \
            --release \
            --target wasm32-unknown-unknown \
            --bin arcade-web \
            --features web
          wasm-bindgen \
            --target web \
            --out-name arcade-web \
            --out-dir dist/pkg \
            _standalone/gpe_arcade/target/wasm32-unknown-unknown/release/arcade-web.wasm

      - name: Build Smart Boy Hero from standalone repository
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo build \
            --manifest-path _standalone/gpe_smartboyhero/Cargo.toml \
            --release \
            --target wasm32-unknown-unknown \
            --bin sbh-web \
            --features web
          wasm-bindgen \
            --target web \
            --out-name sbh-web \
            --out-dir dist/pkg \
            _standalone/gpe_smartboyhero/target/wasm32-unknown-unknown/release/sbh-web.wasm

          cargo build \
            --manifest-path _standalone/gpe_smartboyhero/Cargo.toml \
            --release \
            --target wasm32-unknown-unknown \
            --bin sbh-iso-web \
            --features web
          wasm-bindgen \
            --target web \
            --out-name sbh-iso-web \
            --out-dir dist/pkg \
            _standalone/gpe_smartboyhero/target/wasm32-unknown-unknown/release/sbh-iso-web.wasm

      - name: Verify standalone Pages artifact
        run: |
          test -f dist/pkg/arcade-web.js
          test -f dist/pkg/arcade-web_bg.wasm
          test -f dist/pkg/sbh-web.js
          test -f dist/pkg/sbh-web_bg.wasm
          test -f dist/pkg/sbh-iso-web.js
          test -f dist/pkg/sbh-iso-web_bg.wasm
          grep -Fq './pkg/arcade-web.js' dist/index.html
          grep -Fq './pkg/sbh-web.js' dist/smart_boy_hero.html
          grep -Fq './pkg/sbh-iso-web.js' dist/smart_boy_hero_iso.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
