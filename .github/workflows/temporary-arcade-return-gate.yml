name: Temporary Arcade return gate validation

on:
  push:
    branches:
      - m5.4-arcade-launcher

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m5.4-arcade-launcher
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup component add rustfmt clippy
      - name: Patch Arcade return input gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('examples/arcade/game.rs')
          s = p.read_text()
          s = s.replace(
              '    active_game: Option<Box<dyn Game>>,\n    waiting_for_launch_release: bool,\n',
              '    active_game: Option<Box<dyn Game>>,\n    waiting_for_launch_release: bool,\n    waiting_for_catalog_release: bool,\n',
              1,
          )
          s = s.replace(
              '            active_game: None,\n            waiting_for_launch_release: false,\n',
              '            active_game: None,\n            waiting_for_launch_release: false,\n            waiting_for_catalog_release: false,\n',
              1,
          )
          marker = '''        self.catalog_controls.update(frame.input);\n\n        if self.catalog_controls.action(CATALOG_UP).pressed() {'''
          replacement = '''        self.catalog_controls.update(frame.input);\n\n        if self.waiting_for_catalog_release {\n            if self.catalog_controls.action(CATALOG_SELECT).held() {\n                self.render_catalog(frame.framebuffer);\n                return GameResult::Continue;\n            }\n            self.waiting_for_catalog_release = false;\n            if let Some(catalog_pad) = &mut self.catalog_pad {\n                catalog_pad.reset(&mut self.catalog_controls);\n            }\n        }\n\n        if self.catalog_controls.action(CATALOG_UP).pressed() {'''
          if marker not in s:
              raise SystemExit('catalog update marker not found')
          s = s.replace(marker, replacement, 1)
          marker = '''        self.active_game = None;\n        self.waiting_for_launch_release = false;\n    }'''
          replacement = '''        self.active_game = None;\n        self.waiting_for_launch_release = false;\n        self.waiting_for_catalog_release = true;\n    }'''
          if marker not in s:
              raise SystemExit('return_to_catalog marker not found')
          s = s.replace(marker, replacement, 1)
          test_marker = '''    #[test]\n    fn interaction_modes_use_smallest_current_common_surfaces() {'''
          test = '''    #[test]\n    fn returning_to_catalog_arms_catalog_select_release_gate() {\n        let mut app = ArcadeApp::new(ArcadeInteractionMode::Native);\n        app.active_game = Some(Box::new(BreakoutApp::new()));\n\n        app.return_to_catalog();\n\n        assert!(app.active_game.is_none());\n        assert!(app.waiting_for_catalog_release);\n    }\n\n    #[test]\n    fn interaction_modes_use_smallest_current_common_surfaces() {'''
          if test_marker not in s:
              raise SystemExit('test marker not found')
          s = s.replace(test_marker, test, 1)
          p.write_text(s)
          PY
      - run: cargo fmt --all
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/arcade/game.rs
          git commit -m "gate Arcade selection after child exit"
          git push origin HEAD:m5.4-arcade-launcher
