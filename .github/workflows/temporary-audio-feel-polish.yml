name: Temporary audio feel polish

on:
  push:
    branches:
      - m5.9-game-feel-polish

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'trigger audio feel polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m5.9-game-feel-polish

      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy

      - name: Apply requested audio polish
        run: |
          python3 scripts/temporary_audio_feel_patch.py

      - name: Format
        run: cargo fmt --all

      - name: Check diff hygiene
        run: git diff --check

      - name: Test all targets
        run: cargo test --all-targets

      - name: Clippy strict
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Arcade WASM
        run: cargo build --target wasm32-unknown-unknown --example arcade_web

      - name: Commit validated changes and cleanup
        run: |
          rm scripts/temporary_audio_feel_patch.py
          rm .github/workflows/temporary-audio-feel-polish.yml
          git config user.name gotoo
          git config user.email gautier.duval@gmail.com
          git add -A
          git commit -m 'polish Tetris clear audio and Snake crunch'
          git push origin HEAD:m5.9-game-feel-polish
