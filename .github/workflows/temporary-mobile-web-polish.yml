name: Temporary mobile Web polish

on:
  push:
    branches:
      - m5.8-mobile-web-polish

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'trigger mobile web polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: m5.8-mobile-web-polish

      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy

      - name: Make WebAudio context gesture-lazy
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("src/audio.rs"); s=p.read_text(); a=s.index("#[cfg(target_arch = \"wasm32\")]\nmod web {"); b=s.index("\n#[cfg(test)]\nmod tests {", a); n=base64.b64decode("").decode(); p.write_text(s[:a]+n+s[b:])'
          sed -i 's/right: 10px;/left: 10px;/' web/fullscreen.js

      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --target wasm32-unknown-unknown --example arcade_web
      - run: node --check web/fullscreen.js

      - name: Commit validated mobile Web polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio.rs web/fullscreen.js
          git commit -m "improve mobile web audio activation and fullscreen placement"
          git push origin HEAD:m5.8-mobile-web-polish
