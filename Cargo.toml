[package]
name = "gotoo-pixel-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/gotoo77/gotoo-pixel-engine"

[dependencies]
hound = "3.5.1"
include_dir = "0.7.4"
pollster = "1.0.1"
serde_json = "1.0.145"
wgpu = "30.0.0"
winit = "0.30.13"

[dev-dependencies]
wasm-bindgen = "=0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = ["AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "BaseAudioContext", "Storage", "Window", "Gamepad", "GamepadButton", "GamepadMappingType", "Navigator"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6.0.0"
gilrs = "0.11.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[[example]]
name = "web_demo"
path = "examples/web_demo.rs"
crate-type = ["cdylib"]

[[example]]
name = "snake_web"
path = "examples/snake_web.rs"
crate-type = ["cdylib"]

[[example]]
name = "breakout_web"
path = "examples/breakout_web.rs"
crate-type = ["cdylib"]

[[example]]
name = "tetris_web"
path = "examples/tetris_web.rs"
crate-type = ["cdylib"]

[[example]]
name = "pong_web"
path = "examples/pong_web.rs"
crate-type = ["cdylib"]

[[example]]
name = "space_invaders_web"
path = "examples/space_invaders_web.rs"
crate-type = ["cdylib"]

[[example]]
name = "smart_boy_hero_web"
path = "examples/smart_boy_hero_web.rs"
crate-type = ["cdylib"]

[[example]]
name = "arcade_web"
path = "examples/arcade_web.rs"
crate-type = ["cdylib"]

[[bench]]
name = "primitives"
harness = false
