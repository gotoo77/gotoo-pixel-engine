[package]
name = "gotoo-pixel-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"

[dev-dependencies]
wasm-bindgen = "=0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.77"
web-time = "1.1.0"

[[example]]
name = "web_demo"
path = "examples/web_demo.rs"
crate-type = ["cdylib"]

[[example]]
name = "snake_web"
path = "examples/snake_web.rs"
crate-type = ["cdylib"]

[[bench]]
name = "primitives"
harness = false
