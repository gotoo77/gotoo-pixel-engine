<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Void Canticle</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #05060e;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: min(720px, 100vw);
        height: auto;
        max-height: 100vh;
        touch-action: none;
        image-rendering: pixelated;
      }

      #audio-hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 6px 9px;
        border: 1px solid #c384ff;
        background: #05060edd;
        color: #ddd6ff;
        font: 12px monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="audio-hint">AUDIO: CLICK / TAP GAME OR PRESS KEY ONCE</div>
    <script src="./audio-unlock.js"></script>
    <script type="module">
      import init from "./pkg/void_canticle_web.js";

      const audioHint = document.querySelector("#audio-hint");
      const dismissAudioHint = () => audioHint?.remove();
      for (const type of ["pointerdown", "touchstart", "keydown"]) {
        document.addEventListener(type, dismissAudioHint, { once: true, capture: true });
      }

      init();
    </script>
    <script type="module" src="./fullscreen.js"></script>
  </body>
</html>
